name: Validate benchmark evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
      - name: Validate committed results
        run: |
          shopt -s nullglob
          for result in results/*/*/result.json; do
            PYTHONPATH=src python3 -m hunyuanocr_bench.cli validate-result "$result"
          done
      - name: Validate aggregation
        run: |
          PYTHONPATH=src python3 -m hunyuanocr_bench.cli aggregate \
            --results-root results --output-dir /tmp/leaderboards
      - name: Verify committed main leaderboards
        if: github.ref_name == 'main'
        run: |
          ./scripts/aggregate.sh
          git diff --exit-code -- leaderboards

  machine-scope:
    if: startsWith(github.ref_name, 'machine/') || startsWith(github.head_ref, 'machine/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate machine branch scope
        env:
          BASE_REF: origin/kickoff
          MACHINE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: ./scripts/validate-machine-branch.sh
